spring.application.name=jobtrack-api
spring.jpa.open-in-view=false

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtrack}
spring.datasource.username=${DB_USERNAME:jobtrack_user}
spring.datasource.password=${DB_PASSWORD:jobtrack_pass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET:clave-de-desarrollo-solo-para-local-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}