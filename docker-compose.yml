services:
  postgres:
    image: postgres:17-alpine
    container_name: jobtrack-db
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: jobtrack_user
      POSTGRES_PASSWORD: jobtrack_pass
    ports:
      - "5432:5432"
    volumes:
      - jobtrack_data:/var/lib/postgresql/data

volumes:
  jobtrack_data: